{% set version = "2.1.1" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-statsexpressions
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/statsExpressions_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/statsExpressions/statsExpressions_{{ version }}.tar.gz
  sha256: 4102d8286bff459b55d2fdc295ef2673bb3ad223a409b1ed7dac9a16e1c409c9

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]
  skip: true  # [r_base == "4.4"]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-bayesfactor >=0.9.12_4.8
    - r-pmcmrplus >=1.9.12
    - r-wrs2 >=1.1_7
    - r-afex >=1.5_1
    - r-bayestestr >=0.18.1
    - r-correlation >=0.8.8
    - r-datawizard >=1.3.1
    - r-dplyr >=1.2.1
    - r-effectsize >=1.0.3
    - r-glue >=1.8.1
    - r-insight >=1.5.2
    - r-parameters >=0.29.2
    - r-performance >=0.17.1
    - r-purrr >=1.2.2
    - r-rlang >=1.3.0
    - r-rstantools >=2.7.0
    - r-tidyr >=1.3.2
    - r-withr >=3.0.3
  run:
    - r-base
    - r-bayesfactor >=0.9.12_4.8
    - r-pmcmrplus >=1.9.12
    - r-wrs2 >=1.1_7
    - r-afex >=1.5_1
    - r-bayestestr >=0.18.1
    - r-correlation >=0.8.8
    - r-datawizard >=1.3.1
    - r-dplyr >=1.2.1
    - r-effectsize >=1.0.3
    - r-glue >=1.8.1
    - r-insight >=1.5.2
    - r-parameters >=0.29.2
    - r-performance >=0.17.1
    - r-purrr >=1.2.2
    - r-rlang >=1.3.0
    - r-rstantools >=2.7.0
    - r-tidyr >=1.3.2
    - r-withr >=3.0.3

test:
  commands:
    - $R -e "library('statsExpressions')"           # [not win]
    - "\"%R%\" -e \"library('statsExpressions')\""  # [win]

about:
  home: https://indrajeetpatil.github.io/statsExpressions/
  dev_url: https://github.com/IndrajeetPatil/statsExpressions
  license: MIT
  summary: 'Utilities for producing dataframes with rich details for the most common types of
    statistical approaches and tests: parametric, nonparametric, robust, and Bayesian
    t-test, one-way ANOVA, correlation analyses, contingency table analyses, and meta-analyses.
    The functions are pipe-friendly and provide a consistent syntax to work with tidy
    data. These dataframes additionally contain expressions with statistical details,
    and can be used in graphing packages. This package also forms the statistical processing
    backend for ''ggstatsplot''. References: Patil (2021) <doi:10.21105/joss.03236>.'
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
